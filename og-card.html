<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 100 700; src: url(fonts/IBMPlexSans-var.woff2) format('woff2'); }
  @font-face { font-family: 'Michroma'; src: url(fonts/Michroma-400.woff2) format('woff2'); }
  html, body { margin: 0; }
  .card { width: 1200px; height: 627px; position: relative; overflow: hidden; color: #fff; font-family: 'IBM Plex Sans', sans-serif;
    background:
      radial-gradient(circle at 90% 10%, rgba(188,31,45,.6), transparent 40%),
      radial-gradient(circle at 5% 100%, rgba(47,49,146,.95), transparent 48%),
      radial-gradient(circle at 65% 115%, rgba(248,173,64,.35), transparent 42%),
      #10123a; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #f8ad40, #e8572f 35%, #bc1f2d 60%, #2f3192); }
  .in { position: absolute; left: 72px; top: 64px; right: 72px; }
  .logo { height: 92px; display: block; }
  .tag { margin: 46px 0 18px; font-family: 'Michroma', sans-serif; font-size: 20px; letter-spacing: .14em; }
  .tag .p { color: #ff6b78; } .tag .k { color: #9da1ff; } .tag .e { color: #f8ad40; } .tag .s { color: #5b5e8f; margin: 0 10px; }
  h1 { margin: 64px 0 0; font-size: 64px; line-height: 1.08; letter-spacing: -.02em; font-weight: 700; }
  .grad { background: linear-gradient(90deg, #ffc15e, #ff7a45 45%, #ff5468); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 22px 0 0; font-size: 26px; color: #d3d5f0; }
  .url { position: absolute; right: 72px; bottom: 52px; font-size: 26px; font-weight: 600; color: #fff; letter-spacing: .02em; }
  .beat { position: absolute; left: 72px; bottom: 44px; width: 420px; height: 40px; }
  .beat path { fill: none; stroke: #ff6b78; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
</style></head>
<body><div class="card">
  <div class="in">
    <img class="logo" src="logo-white.png" alt="">
    <h1>Workday integrations,<br><span class="grad">built fast and built right.</span></h1>
    <p class="sub">Independent Workday integration consultant · 16 years · Studio, EIB, PECI, Cloud Connect</p>
  </div>
  <svg class="beat" viewBox="0 0 420 40"><path d="M0 26 H90 L100 26 L108 8 L118 38 L128 2 L138 32 L146 26 H240 L250 26 L258 8 L268 38 L278 2 L288 32 L296 26 H420"/></svg>
  <div class="url">intsys.guru</div>
  <div class="bar"></div>
</div></body></html>
